name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run lint --prefix backend
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Validate local scripts
        run: bash -n provision scripts/backup scripts/restore
      - name: Validate Grafana dashboard
        run: node -e "JSON.parse(require('fs').readFileSync('monitoring/grafana/dashboards/secureinbox-local.json'))"
      - name: Validate Docker Compose
        env:
          MONGO_ROOT_PASSWORD: ci-mongo-password
          JWT_SECRET: ci-jwt-secret
          MAIL_TOKEN_ENCRYPTION_KEY: ci-encryption-key
          DEMO_USER_PASSWORD: ci-demo-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: |
          docker compose config
      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Build application containers
        run: docker compose --env-file .env.example build backend frontend
