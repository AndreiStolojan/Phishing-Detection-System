<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Manual Test</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: #fffdf8;
      --ink: #1f2933;
      --muted: #52606d;
      --line: #d9d2c3;
      --accent: #0f766e;
      --accent-2: #b45309;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(180, 83, 9, 0.14), transparent 32%),
        linear-gradient(180deg, #f9f6ef 0%, var(--bg) 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 720px;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(31, 41, 51, 0.06);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font: inherit;
      cursor: pointer;
      background: var(--ink);
      color: white;
      transition: transform 140ms ease, opacity 140ms ease;
      margin-right: 8px;
      margin-top: 4px;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .secondary {
      background: var(--accent);
    }

    .warning {
      background: var(--accent-2);
    }

    .danger {
      background: var(--danger);
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #201a17;
      color: #f8f1e7;
      padding: 14px;
      border-radius: 14px;
      min-height: 220px;
      overflow: auto;
    }

    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f2ece0;
      color: var(--muted);
      min-height: 48px;
    }

    .pill {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #efe6d8;
      color: var(--ink);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Auth Test UI</h1>
      <p>
        Pagină temporară pentru verificarea fluxului de autentificare. Tokenul este
        salvat în <code>localStorage</code>, iar la refresh se încearcă automat
        revalidarea sesiunii prin <code>/api/v1/users/me</code>.
      </p>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Register</h2>
        <form id="register-form">
          <label>
            Name
            <input id="register-name" name="name" type="text" value="Auth Test User" required />
          </label>
          <label>
            Email
            <input id="register-email" name="email" type="email" value="auth-ui@example.com" required />
          </label>
          <label>
            Password
            <input id="register-password" name="password" type="password" value="parola123" required />
          </label>
          <button type="submit">Register</button>
        </form>
      </article>

      <article class="card">
        <h2>Login</h2>
        <form id="login-form">
          <label>
            Email
            <input id="login-email" name="email" type="email" value="auth-ui@example.com" required />
          </label>
          <label>
            Password
            <input id="login-password" name="password" type="password" value="parola123" required />
          </label>
          <button class="secondary" type="submit">Login</button>
        </form>
      </article>

      <article class="card">
        <h2>Session</h2>
        <button id="me-button" class="warning" type="button">Load /users/me</button>
        <button id="logout-button" class="danger" type="button">Local Logout</button>
        <div class="status" id="session-status">No request yet.</div>
        <div class="pill" id="token-state">Token absent</div>
      </article>

      <article class="card" style="grid-column: 1 / -1;">
        <h2>Response</h2>
        <pre id="response-output">Ready.</pre>
      </article>
    </section>
  </main>

  <script>
    const API_BASE = "/api/v1";
    const TOKEN_KEY = "manual_auth_token";

    const registerForm = document.getElementById("register-form");
    const loginForm = document.getElementById("login-form");
    const meButton = document.getElementById("me-button");
    const logoutButton = document.getElementById("logout-button");
    const responseOutput = document.getElementById("response-output");
    const sessionStatus = document.getElementById("session-status");
    const tokenState = document.getElementById("token-state");

    const setOutput = (label, payload) => {
      responseOutput.textContent = `${label}\n\n${JSON.stringify(payload, null, 2)}`;
    };

    const setStatus = (message) => {
      sessionStatus.textContent = message;
    };

    const updateTokenState = () => {
      const token = localStorage.getItem(TOKEN_KEY);
      tokenState.textContent = token ? "Token prezent in localStorage" : "Token absent";
    };

    const saveToken = (token) => {
      if (token) {
        localStorage.setItem(TOKEN_KEY, token);
      }
      updateTokenState();
    };

    const clearToken = () => {
      localStorage.removeItem(TOKEN_KEY);
      updateTokenState();
    };

    const apiRequest = async (path, options = {}) => {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {}),
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers,
      });

      const data = await response.json().catch(() => ({}));

      return {
        ok: response.ok,
        status: response.status,
        data,
      };
    };

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        name: document.getElementById("register-name").value,
        email: document.getElementById("register-email").value,
        password: document.getElementById("register-password").value,
      };

      setStatus("Sending register request...");
      const result = await apiRequest("/auth/register", {
        method: "POST",
        body: JSON.stringify(payload),
      });

      if (result.ok) {
        saveToken(result.data?.data?.token);
        setStatus(`Register OK (${result.status}). Token salvat.`);
      } else {
        setStatus(`Register failed (${result.status}).`);
      }

      setOutput("REGISTER RESPONSE", result);
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-password").value,
      };

      setStatus("Sending login request...");
      const result = await apiRequest("/auth/login", {
        method: "POST",
        body: JSON.stringify(payload),
      });

      if (result.ok) {
        saveToken(result.data?.data?.token);
        setStatus(`Login OK (${result.status}). Token salvat.`);
      } else {
        setStatus(`Login failed (${result.status}).`);
      }

      setOutput("LOGIN RESPONSE", result);
    });

    meButton.addEventListener("click", async () => {
      setStatus("Loading current user...");
      const result = await apiRequest("/users/me", { method: "GET" });

      if (result.ok) {
        setStatus(`Session valid (${result.status}). User conectat.`);
      } else {
        setStatus(`Session invalid (${result.status}).`);
      }

      setOutput("ME RESPONSE", result);
    });

    logoutButton.addEventListener("click", () => {
      clearToken();
      setStatus("Token sters local. Fa refresh si vezi ca sesiunea nu mai este refacuta.");
      setOutput("LOCAL LOGOUT", { success: true });
    });

    const bootstrapSession = async () => {
      updateTokenState();

      if (!localStorage.getItem(TOKEN_KEY)) {
        return;
      }

      setStatus("Token gasit. Verific sesiunea dupa refresh...");
      const result = await apiRequest("/users/me", { method: "GET" });

      if (result.ok) {
        setStatus("Sesiunea a fost refacuta dupa refresh.");
      } else {
        clearToken();
        setStatus("Token invalid dupa refresh. A fost sters din localStorage.");
      }

      setOutput("BOOTSTRAP SESSION", result);
    };

    bootstrapSession();
  </script>
</body>
</html>
