$kind: http-request
name: List Emails
url: "{{baseUrlLicenta}}/emails"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      pm.environment.set("scanId", res.data.items[0]._id);
    language: text/javascript
