groups:
  - name: secureinbox-local
    rules:
      - alert: BackendDown
        expr: up{job="secureinbox-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SecureInbox backend is unreachable

      - alert: BackendHighErrorRate
        expr: |
          sum(rate(secureinbox_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(secureinbox_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of SecureInbox requests are failing

      - alert: BackendHighMemory
        expr: secureinbox_process_resident_memory_bytes > 512 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SecureInbox backend memory is above 512 MiB
